<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#f5f7f3;--card:#fff;--text:#17231d;--muted:#718078;
  --primary:#17745a;--primary2:#0f5b47;--line:#e1e8e3;--gold:#c89b3c;
  --shadow:0 10px 35px rgba(19,50,39,.08);
  --hero-grad:linear-gradient(135deg,#125e4b,#238267);
}
/* --- Tema latar aplikasi, dipilih lewat panel pengaturan --- */
body[data-theme="malam"]{
  --bg:#0f1613;--card:#182420;--text:#e6ede9;--muted:#8aa198;
  --primary:#3fcf9e;--primary2:#2fa682;--line:#28372f;--gold:#e0b565;
  --shadow:0 10px 35px rgba(0,0,0,.35);
  --hero-grad:linear-gradient(135deg,#0d3a2e,#175945);
}
body[data-theme="sepia"]{
  --bg:#f6efe0;--card:#fffaf0;--text:#3a2e1f;--muted:#8a7458;
  --primary:#8a6518;--primary2:#6e4f10;--line:#e6d9bd;--gold:#b6841f;
  --shadow:0 10px 35px rgba(90,66,20,.1);
  --hero-grad:linear-gradient(135deg,#6e4f10,#a97d24);
}
body[data-theme="biru"]{
  --bg:#eef3fa;--card:#fff;--text:#122234;--muted:#5a7186;
  --primary:#1c5fa8;--primary2:#154880;--line:#dbe6f2;--gold:#c89b3c;
  --shadow:0 10px 35px rgba(15,55,95,.1);
  --hero-grad:linear-gradient(135deg,#123b66,#1c5fa8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;transition:background .25s,color .25s}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1200px;margin:auto;padding:15px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--primary)}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--primary);color:white;display:grid;place-items:center;font-family:Amiri;font-size:23px}
.search{flex:1;position:relative;max-width:600px;margin:auto}
.search input{width:100%;border:1px solid var(--line);background:#f7faf8;border-radius:14px;padding:12px 15px 12px 43px;outline:none;color:var(--text)}
.search input:focus{border-color:#9bc8ba;box-shadow:0 0 0 4px rgba(23,116,90,.08)}
.search span{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.nav-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;color:var(--text)}

/* --- Saran pencarian ala Google --- */
.suggestions{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:30;display:none;text-align:left}
.suggestions.show{display:block}
.suggestion{display:flex;align-items:center;gap:11px;padding:10px 15px;cursor:pointer;border-bottom:1px solid var(--line)}
.suggestion:last-child{border-bottom:0}
.suggestion:hover,.suggestion.hl{background:var(--bg)}
.suggestion span.ic{color:var(--muted);flex:0 0 auto}
.suggestion .sname{font-weight:600;font-size:14px}
.suggestion .smeta{font-size:12px;color:var(--muted);margin-top:1px}
.suggestion .sarabic{margin-left:auto;font-family:Amiri;font-size:19px;color:var(--primary)}

/* --- Panel pengaturan (tema/latar) --- */
.settings-wrap{position:relative}
.settings-panel{position:absolute;right:0;top:calc(100% + 8px);width:220px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:none;z-index:30}
.settings-panel.show{display:block}
.settings-panel h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.theme-opt{border:2px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);color:var(--text);font-size:12px}
.theme-opt.active{border-color:var(--primary)}
.theme-swatch{width:100%;height:26px;border-radius:7px}
.sw-default{background:linear-gradient(135deg,#125e4b,#238267)}
.sw-malam{background:linear-gradient(135deg,#0d3a2e,#175945)}
.sw-sepia{background:linear-gradient(135deg,#6e4f10,#a97d24)}
.sw-biru{background:linear-gradient(135deg,#123b66,#1c5fa8)}

/* --- Tombol putar audio penuh satu surat --- */
.audio-surah{border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:10px;padding:9px 13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.reader-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.surah-audio-player{display:none;width:100%;height:38px;margin:0 22px 6px}
.surah-audio-player.show{display:block}
.hero{max-width:1200px;margin:28px auto 0;padding:0 20px}
.hero-card{border-radius:25px;padding:30px;background:var(--hero-grad);color:white;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-card:after{content:"۞";position:absolute;right:35px;top:-25px;font-family:Amiri;font-size:180px;opacity:.08}
.hero h1{margin:0 0 7px;font-family:Amiri;font-size:38px}
.hero p{margin:0;color:#dcefe9}
.continue{margin-top:22px;display:inline-flex;align-items:center;gap:10px;background:white;color:var(--primary);border:0;padding:11px 15px;border-radius:12px;font-weight:600}
.layout{max-width:1200px;margin:25px auto;padding:0 20px 50px;display:grid;grid-template-columns:1fr 290px;gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-head h2{font-size:18px;margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;color:var(--muted)}
.filters button.active{background:#e4f2ed;color:var(--primary);border-color:#c6e1d7}
.surah-list{display:grid;grid-template-columns:repeat(2,1fr)}
.surah{padding:16px 18px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);transition:.18s}
.surah:hover{background:#f7faf8}
.surah-num{width:37px;height:37px;display:grid;place-items:center;border-radius:11px;background:#eef5f1;color:var(--primary);font-weight:700;font-size:13px}
.surah-info{min-width:0;flex:1}
.surah-name{font-weight:600}
.surah-meta{font-size:12px;color:var(--muted);margin-top:3px}
.arabic-name{font-family:Amiri;font-size:22px}
.bookmark{border:0;background:transparent;color:#a4afa9;font-size:20px}
.bookmark.saved{color:var(--gold)}
.sidebar{display:flex;flex-direction:column;gap:18px}
.juz-grid{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.juz{border:1px solid var(--line);background:#fbfcfb;border-radius:10px;padding:10px 4px;text-align:center;font-size:12px;color:#516159}
.juz:hover,.juz.active{background:#e6f3ee;border-color:#c3ded4;color:var(--primary);font-weight:600}
.saved-list{padding:8px 15px 15px}
.saved-empty{color:var(--muted);font-size:13px;padding:12px 5px}
.saved-item{display:flex;align-items:center;gap:10px;padding:10px 5px;border-bottom:1px solid var(--line)}
.saved-item button{border:0;background:transparent;text-align:left;flex:1;color:var(--text)}
.reader{display:none}
.reader.show{display:block}
.reader-head{padding:22px;display:flex;justify-content:space-between;align-items:center}
.reader-title{font-family:Amiri;font-size:32px;margin:0}
.reader-sub{color:var(--muted);font-size:13px}
.ayah{padding:22px 24px 28px;border-top:1px solid var(--line)}
.ayah-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.ayah-num{color:var(--primary);font-weight:700;font-size:13px}
.ayah-ar{font-family:Amiri,serif;font-size:34px;line-height:2.15;text-align:right;margin:8px 0 14px;color:#12664f;direction:rtl}
.ayah-latin{line-height:1.85;color:#286b9b;background:#f2f8fc;border-left:4px solid #79afd2;padding:10px 13px;border-radius:8px;margin:10px 0;font-family:Georgia,serif;font-style:italic}
.ayah-id{line-height:1.85;color:#3f4944;background:#f6f7f6;border-left:4px solid #9aa59f;padding:10px 13px;border-radius:8px;margin-top:10px}
.basmala{font-family:Amiri;font-size:34px;line-height:2;text-align:center;color:#8a6518;background:#fffaf0;border:1px solid #ead9ad;border-radius:15px;padding:18px 20px;margin:18px 24px}
.basmala-wrap{padding:0 24px 10px}
.audio{border:1px solid #c7ddd5;background:#f1f8f5;border-radius:9px;padding:8px 11px;color:var(--primary);font-weight:600}
.audio-player{display:block;width:100%;height:38px;margin:10px 0 14px}
.empty{padding:45px;text-align:center;color:var(--muted)}
@media(max-width:600px){.ayah{padding:18px 15px 24px}.ayah-ar{font-size:29px}.basmala{margin:14px 15px;font-size:30px}}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{order:2}.surah-list{grid-template-columns:1fr}.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%}}
</style>
</head>

<div class="app">
<header class="topbar">
  <div class="nav">
    <div class="brand"><div class="brand-mark">ق</div> Qur'an</div>
    <div class="search">
      <span>⌕</span>
      <input id="search" placeholder="Cari surat atau arti surat..." autocomplete="off">
      <div class="suggestions" id="suggestions"></div>
    </div>
    <button class="nav-btn" id="bookmarkBtn">☆ Tersimpan</button>
    <div class="settings-wrap">
      <button class="nav-btn" id="settingsBtn" title="Pengaturan tampilan">⚙ Pengaturan</button>
      <div class="settings-panel" id="settingsPanel">
        <h3>Latar aplikasi</h3>
        <div class="theme-grid" id="themeGrid">
          <button class="theme-opt" data-theme="default"><span class="theme-swatch sw-default"></span>Default</button>
          <button class="theme-opt" data-theme="malam"><span class="theme-swatch sw-malam"></span>Malam</button>
          <button class="theme-opt" data-theme="sepia"><span class="theme-swatch sw-sepia"></span>Sepia</button>
          <button class="theme-opt" data-theme="biru"><span class="theme-swatch sw-biru"></span>Biru</button>
        </div>
      </div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-card">
    <h1>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</h1>
    <p>Baca Al-Qur'an dengan tenang, simpan ayat favorit, dan jelajahi surat berdasarkan juz.</p>
    <button class="continue" id="continueBtn">▶ Lanjut membaca</button>
  </div>
</section>

<main class="layout">
  <section>
    <div class="card" id="listCard">
      <div class="card-head">
        <h2 id="sectionTitle">Daftar Surat</h2>
        <div class="filters">
          <button class="active" data-filter="all">Semua</button>
          <button data-filter="saved">Tersimpan</button>
        </div>
      </div>
      <div class="surah-list" id="surahList"></div>
      <div class="empty" id="empty" style="display:none">Tidak ada surat yang cocok.</div>
    </div>

    <div class="card reader" id="reader">
      <div class="reader-head">
        <div>
          <h2 class="reader-title" id="readerTitle"></h2>
          <div class="reader-sub" id="readerSub"></div>
        </div>
        <div class="reader-actions">
          <button class="audio-surah" id="surahAudioBtn" type="button">🔊 Putar Surat</button>
          <button class="nav-btn" id="closeReader">← Kembali</button>
        </div>
      </div>
      <audio class="surah-audio-player" id="surahAudioPlayer" controls preload="none"></audio>
      <div id="ayahList"></div>
    </div>
  </section>

  <aside class="sidebar">
    <div class="card">
      <div class="card-head"><h2>Pilih Juz</h2></div>
      <div class="juz-grid" id="juzGrid"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Bookmark</h2></div>
      <div class="saved-list" id="savedList"></div>
    </div>
  </aside>
</main>
</div>

// --- Tema latar aplikasi ---
function applyTheme(name){
  if(name==="default"){ document.body.removeAttribute("data-theme"); }
  else{ document.body.setAttribute("data-theme", name); }
  localStorage.setItem("quranTheme", name);
  document.querySelectorAll(".theme-opt").forEach(b=>b.classList.toggle("active", b.dataset.theme===name));
}

const empty = document.getElementById("empty");
const search = document.getElementById("search");

function saveBookmarks(){localStorage.setItem("quranBookmarks",JSON.stringify(bookmarks));renderSaved();}

// Banyak surat (mis. Al-Baqarah) beririsan di lebih dari satu juz, jadi
// tiap surat sekarang nyimpen juzStart & juzEnd (s[4], s[5]), bukan cuma
// satu angka. Fungsi ini yang bikin tampilannya jadi "Juz 1" atau "Juz 1-3".
function juzLabel(s){
  return s[4]===s[5] ? `${s[4]}` : `${s[4]}-${s[5]}`;
}

// Normalisasi teks buat pencarian: huruf kecil, buang tanda baca/spasi/
// apostrof/strip, buang diakritik Latin & Arab. Jadi "Al-Fatihah",
// "alfatihah", "Al Fatihah" semua dianggap sama.
function normalizeSearchText(s){
  return String(s).toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"")
    .replace(/[^a-z0-9\u0600-\u06FF]/g,"");
}
// Fuzzy match ringan: cocok kalau jadi substring setelah dinormalisasi,
// atau kalau tiap huruf query muncul berurutan di teks target (subsequence)
// — jadi typo/singkatan kecil tetap ketemu, tidak harus sama persis.
function fuzzyMatch(query, target){
  const nq=normalizeSearchText(query);
  if(!nq) return true;
  const nt=normalizeSearchText(target);
  if(nt.includes(nq)) return true;
  let qi=0;
  for(let i=0;i<nt.length && qi<nq.length;i++){
    if(nt[i]===nq[qi]) qi++;
  }
  return qi===nq.length;
}

function renderList(){
  const q=search.value.trim();
  const filtered=surahs.map((s,i)=>({...s,i})).filter(s=>{
    const matchJuz=currentJuz==="all" || (Number(currentJuz)>=s[4] && Number(currentJuz)<=s[5]);
    const matchSaved=currentFilter==="all" || bookmarks.includes(s.i);
    const matchSearch=!q || fuzzyMatch(q,s[0]) || fuzzyMatch(q,s[1]) || fuzzyMatch(q,s[2]);
    return matchJuz&&matchSaved&&matchSearch;
  });
  list.innerHTML="";
  filtered.forEach(s=>{
    const el=document.createElement("div");el.className="surah";
    el.innerHTML=`<div class="surah-num">${s.i+1}</div>
      <div class="surah-info"><div class="surah-name">${s[0]}</div><div class="surah-meta">${s[1]} · ${s[3]} ayat · Juz ${juzLabel(s)}</div></div>
      <div class="arabic-name">${s[2]}</div>
      <button class="bookmark ${bookmarks.includes(s.i)?"saved":""}" title="Bookmark">${bookmarks.includes(s.i)?"★":"☆"}</button>`;
    el.addEventListener("click",e=>{if(e.target.closest(".bookmark")) return;openSurah(s.i)});
    el.querySelector(".bookmark").onclick=()=>{toggleBookmark(s.i)};
    list.appendChild(el);
  });
  empty.style.display=filtered.length?"none":"block";
  document.getElementById("sectionTitle").textContent=currentJuz==="all"?"Daftar Surat":`Juz ${currentJuz}`;
}
function toggleBookmark(i){
  bookmarks=bookmarks.includes(i)?bookmarks.filter(x=>x!==i):[...bookmarks,i];
  saveBookmarks();renderList();
}
function renderSaved(){
  const box=document.getElementById("savedList");box.innerHTML="";
  if(!bookmarks.length){box.innerHTML='<div class="saved-empty">Belum ada surat yang disimpan.</div>';return}
  bookmarks.forEach(i=>{
    const s=surahs[i];const row=document.createElement("div");row.className="saved-item";
    row.innerHTML=`<span>★</span><button>${s[0]}<br><small style="color:#718078">${s[3]} ayat</small></button>`;
    row.querySelector("button").onclick=()=>openSurah(i);box.appendChild(row);
  });
}
function renderJuz(){
  const g=document.getElementById("juzGrid");
  g.innerHTML='<button class="juz active" data-juz="all">Semua</button>';
  for(let j=1;j<=30;j++)g.innerHTML+=`<button class="juz" data-juz="${j}">Juz ${j}</button>`;
  g.querySelectorAll(".juz").forEach(b=>b.onclick=()=>{
    currentJuz=b.dataset.juz;g.querySelectorAll(".juz").forEach(x=>x.classList.remove("active"));b.classList.add("active");
    currentFilter="all";document.querySelectorAll(".filters button").forEach(x=>x.classList.toggle("active",x.dataset.filter==="all"));renderList();
  });
}

// --- Perbaikan: deteksi & pembersihan bismillah yang lebih andal ---
// API Al-Qur'an kadang menuliskan basmalah di awal ayat pertama dengan
// harakat/format yang sedikit berbeda dari string basmalah statis kita,
// sehingga regex lama gagal cocok dan basmalah tampil dua kali
// (satu dari div terpisah, satu lagi masih menempel di teks ayat).
// Regex baru ini mengizinkan tanda diakritik apa pun di antara setiap
// huruf dasar, jadi tetap cocok walau harakatnya sedikit berbeda.
const ARABIC_DIACRITICS = "[\\u0610-\\u061A\\u064B-\\u065F\\u0670\\u06D6-\\u06ED\\u08D4-\\u08E1\\u08E3-\\u08FF]*";
// Alif punya banyak bentuk (ا أ إ آ ٱ) — teks Uthmani sering pakai alif
// wasla (ٱ) padahal string basmalah statis kita pakai alif biasa (ا),
// jadi keduanya harus dianggap sama saat mencocokkan.
const ALIF_CLASS = "[اأإآٱ]";
function buildBismillahRegex(){
  const base = "بسم الله الرحمن الرحيم";
  let pattern = "^";
  for(const ch of base){
    if(ch === " "){
      pattern += "\\s+";
    } else if(ch === "ا"){
      pattern += ALIF_CLASS + ARABIC_DIACRITICS;
    } else {
      pattern += ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ARABIC_DIACRITICS;
    }
  }
  pattern += "[\\sۖۗۚۛ,،]*";
  return new RegExp(pattern);
}
const BISMILLAH_REGEX = buildBismillahRegex();

async function openSurah(i, fromPopState=false){
  currentSurah=i;
  const s=surahs[i];

  window.quranScrollY = window.scrollY;
  localStorage.setItem("lastSurah", i);

  if(!fromPopState){
    history.pushState({quranReader:true, surah:i}, "", "#surah-"+(i+1));
  }

  document.getElementById("listCard").style.display="none";
  document.getElementById("reader").classList.add("show");
  document.getElementById("readerTitle").textContent=`${s[0]} — ${s[2]}`;
  document.getElementById("readerSub").textContent=`Surat ke-${i+1} · ${s[3]} ayat · Juz ${juzLabel(s)}`;

  // Reset player audio-per-surat setiap kali surat (baru) dibuka.
  const surahPlayer=document.getElementById("surahAudioPlayer");
  surahPlayer.pause();
  surahPlayer.removeAttribute("src");
  surahPlayer.load();
  surahPlayer.classList.remove("show");
  document.getElementById("surahAudioBtn").textContent="🔊 Putar Surat";

  // Setiap buka surat (baik dari daftar maupun dari dalam reader),
  // mulai dari ATAS surat itu — jangan kebawa posisi scroll sebelumnya.
  const scrollTop=()=>window.scrollTo(0,0);
  scrollTop();
  requestAnimationFrame(()=>requestAnimationFrame(scrollTop));
  setTimeout(scrollTop,50);

  const box=document.getElementById("ayahList");
  box.innerHTML='<div class="empty">Memuat Arab, Latin, terjemahan, dan audio…</div>';

  try{
    const r=await fetch(`https://api.alquran.cloud/v1/surah/${i+1}/editions/quran-uthmani,en.transliteration,id.indonesian`);
    if(!r.ok) throw new Error("API gagal");
    const data=await r.json();
    const editions=data.data || [];
    const ar=(editions.find(x=>x.edition?.identifier==="quran-uthmani")||editions[0])?.ayahs || [];
    const latin=(editions.find(x=>x.edition?.identifier==="en.transliteration")||{ayahs:[]}).ayahs || [];
    const id=(editions.find(x=>x.edition?.identifier==="id.indonesian")||{ayahs:[]}).ayahs || [];

    box.innerHTML="";

    // At-Taubah (indeks 8) tidak diawali basmalah.
    // Al-Fatihah (indeks 0) tetap dapat basmalah "hiasan" di atas,
    // TAPI ayat pertamanya sendiri memang berbunyi basmalah — jadi
    // teks ayat 1 tidak boleh dipotong (lihat kondisi di bawah).
    if(i !== 8){
      const b=document.createElement("div");
      b.className="basmala";
      b.textContent="بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ";
      box.appendChild(b);
    }

    ar.forEach((a,k)=>{
      let arab=a.text || "";
      // Hanya buang basmalah yang "menempel" di teks ayat pertama untuk
      // surat selain At-Taubah (i=8) DAN selain Al-Fatihah (i=0), karena
      // di Al-Fatihah ayat 1 memang basmalah itu sendiri.
      if(k===0 && i!==8 && i!==0){
        arab=arab.replace(BISMILLAH_REGEX,"").trim();
      }

      const d=document.createElement("div");
      d.className="ayah";
      const latinText=latin[k]?.text || "Transliterasi Latin tidak tersedia untuk ayat ini.";
      const idText=id[k]?.text || "Terjemahan Indonesia tidak tersedia untuk ayat ini.";

      d.innerHTML=`
        <div class="ayah-top">
          <span class="ayah-num">Ayat ${a.numberInSurah}</span>
          <button class="audio" type="button" title="Putar audio">🔊 Putar</button>
        </div>
        <div class="ayah-ar" dir="rtl">${escapeHtml(arab)}</div>
        <div class="ayah-latin">${escapeHtml(latinText)}</div>
        <div class="ayah-id">${escapeHtml(idText)}</div>
      `;

      const audioBtn=d.querySelector(".audio");
      audioBtn.onclick=()=>{
        const old=d.querySelector(".audio-player");
        if(old){ old.pause(); old.remove(); audioBtn.textContent="🔊 Putar"; return; }
        const audio=document.createElement("audio");
        audio.className="audio-player";
        audio.controls=true;
        audio.preload="none";
        audio.src=`https://cdn.islamic.network/quran/audio/128/ar.alafasy/${a.number}.mp3`;
        d.insertBefore(audio, d.querySelector(".ayah-ar"));
        audio.play().catch(()=>{ audioBtn.textContent="▶ Tekan audio di bawah"; });
        audio.onended=()=>audioBtn.textContent="🔊 Putar";
        audioBtn.textContent="⏸ Berhenti";
      };

      box.appendChild(d);
    });
  }catch(e){
    console.error(e);
    box.innerHTML='<div class="empty">Gagal memuat data. Pastikan internet aktif, lalu coba buka surat lagi.</div>';
  }
}

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

// --- Saran pencarian ala Google, muncul sebagai dropdown di bawah search ---
const suggestBox = document.getElementById("suggestions");
let hlIndex = -1;

function renderSuggestions(){
  const q = search.value.trim();
  if(!q){ suggestBox.classList.remove("show"); suggestBox.innerHTML=""; hlIndex=-1; return; }
  const matches = surahs.map((s,i)=>({...s,i}))
    .filter(s=>fuzzyMatch(q,s[0])||fuzzyMatch(q,s[1])||fuzzyMatch(q,s[2]))
    .slice(0,7);
  if(!matches.length){ suggestBox.classList.remove("show"); suggestBox.innerHTML=""; hlIndex=-1; return; }
  suggestBox.innerHTML = matches.map(s=>`
    <div class="suggestion" data-i="${s.i}">
      <span class="ic">⌕</span>
      <div>
        <div class="sname">${s[0]}</div>
        <div class="smeta">${s[1]} · ${s[3]} ayat</div>
      </div>
      <span class="sarabic">${s[2]}</span>
    </div>`).join("");
  suggestBox.classList.add("show");
  hlIndex=-1;
  suggestBox.querySelectorAll(".suggestion").forEach(el=>{
    el.addEventListener("mousedown",e=>{ // mousedown supaya jalan sebelum blur menutup dropdown
      e.preventDefault();
      const idx=Number(el.dataset.i);
      suggestBox.classList.remove("show");
      search.value=surahs[idx][0];
      openSurah(idx);
    });
  });
}

search.addEventListener("input",()=>{ renderList(); renderSuggestions(); });
search.addEventListener("focus",renderSuggestions);
search.addEventListener("keydown",e=>{
  const items=[...suggestBox.querySelectorAll(".suggestion")];
  if(!suggestBox.classList.contains("show") || !items.length) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); hlIndex=Math.min(hlIndex+1,items.length-1); items.forEach((el,k)=>el.classList.toggle("hl",k===hlIndex)); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); hlIndex=Math.max(hlIndex-1,0); items.forEach((el,k)=>el.classList.toggle("hl",k===hlIndex)); }
  else if(e.key==="Enter"){ if(hlIndex>=0){ e.preventDefault(); items[hlIndex].dispatchEvent(new Event("mousedown")); } }
  else if(e.key==="Escape"){ suggestBox.classList.remove("show"); }
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".search")) suggestBox.classList.remove("show");
});

// --- Panel pengaturan tema/latar ---
const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");
settingsBtn.onclick=(e)=>{ e.stopPropagation(); settingsPanel.classList.toggle("show"); };
document.querySelectorAll(".theme-opt").forEach(b=>b.onclick=()=>{ applyTheme(b.dataset.theme); });
document.addEventListener("click",e=>{
  if(!e.target.closest(".settings-wrap")) settingsPanel.classList.remove("show");
});

// --- Audio penuh satu surat (terpisah dari audio per-ayat) ---
const surahAudioBtn = document.getElementById("surahAudioBtn");
const surahAudioPlayer = document.getElementById("surahAudioPlayer");
surahAudioBtn.onclick=()=>{
  if(currentSurah===null) return;
  if(surahAudioPlayer.classList.contains("show") && !surahAudioPlayer.paused){
    surahAudioPlayer.pause();
    surahAudioBtn.textContent="🔊 Putar Surat";
    return;
  }
  if(!surahAudioPlayer.src || !surahAudioPlayer.classList.contains("show")){
    surahAudioPlayer.src=`https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${currentSurah+1}.mp3`;
    surahAudioPlayer.classList.add("show");
  }
  surahAudioPlayer.play().catch(()=>{});
  surahAudioBtn.textContent="⏸ Berhenti";
};
surahAudioPlayer.addEventListener("pause",()=>{ surahAudioBtn.textContent="🔊 Putar Surat"; });
surahAudioPlayer.addEventListener("play",()=>{ surahAudioBtn.textContent="⏸ Berhenti"; });
surahAudioPlayer.addEventListener("ended",()=>{ surahAudioBtn.textContent="🔊 Putar Surat"; });

document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
  currentFilter=b.dataset.filter;document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderList();
});
document.getElementById("bookmarkBtn").onclick=()=>{
  currentFilter="saved";document.querySelectorAll(".filters button").forEach(x=>x.classList.toggle("active",x.dataset.filter==="saved"));renderList();
  document.getElementById("listCard").scrollIntoView({behavior:"smooth"});
};
document.getElementById("closeReader").onclick=()=>{
  if(location.hash.startsWith("#surah-")) history.back();
  else closeReaderAndRestore();
};

function closeReaderAndRestore(){
  document.getElementById("reader").classList.remove("show");
  document.getElementById("listCard").style.display="block";
  const surahPlayer=document.getElementById("surahAudioPlayer");
  surahPlayer.pause();
  const y=Number(window.quranScrollY ?? localStorage.getItem("quranScrollY") ?? 0);
  const doScroll=()=>window.scrollTo(0,y);
  // rAF ganda + setTimeout cadangan: memastikan scroll di-set SETELAH
  // browser selesai layout ulang daftar surat, dan setelah kemungkinan
  // auto-scroll-restoration browser sendiri selesai bekerja.
  requestAnimationFrame(()=>requestAnimationFrame(doScroll));
  setTimeout(doScroll,50);
  setTimeout(doScroll,150);
}

window.addEventListener("popstate",()=>{
  if(document.getElementById("reader").classList.contains("show")){
    closeReaderAndRestore();
  }
});

window.addEventListener("scroll",()=>{
  if(document.getElementById("listCard").style.display!=="none"){
    window.quranScrollY=window.scrollY;
    localStorage.setItem("quranScrollY",window.scrollY);
  }
},{passive:true});
document.getElementById("continueBtn").onclick=()=>openSurah(Number(localStorage.getItem("lastSurah")||113));
// Posisi scroll disimpan selama pengguna berada di daftar surat.
renderJuz();renderList();renderSaved();
</script>
